version: 2

models:
  - name: stg_tcgdex__sets
    config:
      meta:
        regles: [R-CAT-07, R-QUA-03]
      contract:
        enforced: true
    description: >
      Une ligne par set et par langue, tirée des fiches de sets (`sets-*.parquet`) du
      dernier snapshot où le set figure, avec date de sortie et série.
    data_tests:
      - unique:
          arguments:
            column_name: "set_id || '|' || language_code"
    columns:
      - name: set_id
        data_type: varchar
        description: Identifiant TCGdex du set, commun aux langues.
        data_tests:
          - not_null
      - name: language_code
        config:
          meta:
            regles: [R-CAT-06]
        data_type: varchar
        description: Langue du set.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fr, en, ja]
      - name: set_name
        data_type: varchar
        description: Nom du set dans sa langue.
      - name: serie_id
        data_type: varchar
        description: Identifiant TCGdex de la série (`swsh`, `SV`).
      - name: serie_name
        data_type: varchar
        description: Nom de la série dans la langue du set.
      - name: abbreviation_official
        data_type: varchar
        description: Sigle officiel (`DAA`), absent pour certains sets.
      - name: abbreviation_localized
        data_type: varchar
        description: Sigle dans la langue du set (`TEM`), absent pour certains sets.
      - name: card_count_official
        data_type: integer
        description: Nombre de cartes annoncé (numérotation officielle, hors cartes secrètes).
      - name: card_count_total
        data_type: integer
        description: Nombre total de cartes du set, cartes secrètes comprises.
      - name: symbol_url
        data_type: varchar
        description: URL de base du symbole du set.
      - name: logo_url
        data_type: varchar
        description: URL de base du logo, absente pour certains sets.
      - name: release_date
        data_type: date
        description: Date de sortie dans la langue du set.
      - name: last_seen_on
        data_type: date
        description: Date du dernier snapshot où le set figure.
      - name: is_current
        data_type: boolean
        description: Présent dans le dernier snapshot des sets.

unit_tests:
  - name: stg_tcgdex__sets_keeps_latest_version
    config:
      meta:
        regles: [R-CAT-07]
    description: >
      Un set est rendu une fois par langue, avec ses informations du dernier snapshot
      où il figure ; un set absent du dernier snapshot a is_current à faux.
    model: stg_tcgdex__sets
    given:
      - input: source('tcgdex', 'sets')
        format: sql
        rows: |
          select * from (values
              ('ja', 'M6', 'old', 'M', 'M', null::date, null, null, 80::bigint, 80::bigint, null, null, null::timestamptz, '{}', 'snapshots/sets-2026-11-16.parquet'),
              ('ja', 'M6', 'new', 'M', 'M', '2026-07-31'::date, null, null, 113, 80, null, null, null, '{}', 'snapshots/sets-2026-11-17.parquet'),
              ('en', 'old', 'gone', 'base', 'Base', '1999-01-09'::date, 'BS', null, 1, 1, null, null, null, '{}', 'snapshots/sets-2026-11-16.parquet')
          ) as t (language, set_id, name, serie_id, serie_name, release_date, abbreviation_official, abbreviation_localized, card_count_total, card_count_official, logo, symbol, fetched_at, raw_json, filename)
    expect:
      rows:
        - {
            set_id: M6,
            language_code: ja,
            set_name: new,
            card_count_official: 80,
            card_count_total: 113,
            release_date: 2026-07-31,
            last_seen_on: 2026-11-17,
            is_current: true,
          }
        - {
            set_id: old,
            language_code: en,
            set_name: gone,
            card_count_official: 1,
            card_count_total: 1,
            release_date: 1999-01-09,
            last_seen_on: 2026-11-16,
            is_current: false,
          }
