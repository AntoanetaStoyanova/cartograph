version: 2

models:
  - name: stg_tcgdex__cards
    config:
      meta:
        regles: [R-CAT-02]
      contract:
        enforced: true
    description: >
      Une ligne par carte et par langue, dans sa version du dernier fichier où elle
      figure, catalogue ou nouvelles cartes ; une carte retirée de l'API (`removed_on`,
      ou absente du dernier catalogue avant COL-05) est gardée avec `is_current = false`.
    data_tests:
      - unique:
          arguments:
            column_name: "card_id || '|' || language_code"
    columns:
      - name: card_id
        data_type: varchar
        description: Identifiant TCGdex de la carte, commun aux langues.
        data_tests:
          - not_null
      - name: language_code
        config:
          meta:
            regles: [R-CAT-06]
        data_type: varchar
        description: Langue de la fiche.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fr, en, ja]
      - name: local_id
        data_type: varchar
        description: Numéro dans le set, pas toujours numérique (`33b`, `THREE`).
      - name: card_name
        data_type: varchar
        description: Nom dans la langue de la fiche.
        data_tests:
          - not_null
      - name: set_id
        data_type: varchar
        description: Identifiant TCGdex du set.
        data_tests:
          - not_null
      - name: category
        config:
          meta:
            regles: [R-CAT-05]
        data_type: varchar
        description: Catégorie normalisée, commune aux langues.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pokemon, trainer, energy]
      - name: rarity
        data_type: varchar
        description: Rareté brute, propre à chaque langue, parfois vide ; code et niveau dans `int_rarity_mapping` (joindre sur `coalesce(rarity, 'None')`).
      - name: pokemon_types
        data_type: varchar[]
        description: Types d'énergie du Pokémon, dans la langue de la fiche.
      - name: hp
        data_type: integer
        description: Points de vie, vide hors Pokémon.
      - name: evolution_stage
        data_type: varchar
        description: Stade d'évolution, dans la langue de la fiche.
      - name: dex_ids
        data_type: integer[]
        description: Numéros du Pokédex national.
      - name: illustrator
        data_type: varchar
        description: Illustrateur.
      - name: regulation_mark
        data_type: varchar
        description: Marque de règlement (lettre), absente des cartes anciennes.
      - name: is_legal_standard
        data_type: boolean
        description: Jouable en format Standard.
      - name: is_legal_expanded
        data_type: boolean
        description: Jouable en format Étendu.
      - name: image_url
        data_type: varchar
        description: URL de base de l'image (sans qualité ni extension).
      - name: cardmarket_product_id
        data_type: bigint
        description: Produit Cardmarket, clé des prix ; parfois absent.
      - name: updated_at
        data_type: timestamp with time zone
        description: Dernière mise à jour de la fiche chez TCGdex.
      - name: last_seen_on
        data_type: date
        description: >
          Date du dernier fichier (`cards-` ou `new-cards-`) où la carte figure sans
          `removed_on` ; vide si aucun fichier conservé ne la montre présente.
      - name: removed_on
        data_type: date
        description: Jour où la carte a disparu de la liste de l'API, vide si elle y figure.
      - name: is_current
        data_type: boolean
        description: >
          Sans `removed_on`, dans le dernier catalogue (`cards-`) ou dans un `new-cards`
          postérieur.

unit_tests:
  - name: stg_tcgdex__cards_keeps_latest_version
    config:
      meta:
        regles: [R-CAT-01, R-CAT-02, R-CAT-05]
    description: >
      Une carte modifiée est rendue dans sa version la plus récente, une carte absente
      du dernier snapshot est gardée avec is_current à faux, la catégorie est normalisée.
    model: stg_tcgdex__cards
    given:
      - input: source('tcgdex', 'cards')
        format: sql
        rows: |
          select * from (values
              ('ja', 'M6-077', '077', 'a', 'M6', 'M6', 'Mega Hyper Rare', 'Pokemon', null, null, null::bigint, null::timestamptz, null::timestamptz, null::varchar, null::date, '{}', 'snapshots/cards-2026-11-09.parquet'),
              ('ja', 'M6-077', '077', 'a', 'M6', 'M6', 'Illustration rare', 'Pokemon', null, null, null, null, null, null, null, '{}', 'snapshots/cards-2026-11-16.parquet'),
              ('en', 'tk-xy-su-26', '26', 'b', 'tk-xy-su', 'tk', 'Common', 'Trainer', null, null, null, null, null, null, null, '{}', 'snapshots/cards-2026-11-09.parquet'),
              ('fr', 'hgss3-1', '1', 'c', 'hgss3', 'Indomptable', 'Rare', 'Dresseur', null, null, null, null, null, null, null, '{}', 'snapshots/cards-2026-11-16.parquet')
          ) as t (language, card_id, local_id, name, set_id, set_name, rarity, category, illustrator, image, id_product, updated, fetched_at, fingerprint, removed_on, raw_json, filename)
    expect:
      rows:
        - {
            card_id: M6-077,
            language_code: ja,
            category: pokemon,
            rarity: Illustration rare,
            last_seen_on: 2026-11-16,
            is_current: true,
          }
        - {
            card_id: tk-xy-su-26,
            language_code: en,
            category: trainer,
            rarity: Common,
            last_seen_on: 2026-11-09,
            is_current: false,
          }
        - {
            card_id: hgss3-1,
            language_code: fr,
            category: trainer,
            rarity: Rare,
            last_seen_on: 2026-11-16,
            is_current: true,
          }

  - name: stg_tcgdex__cards_counts_new_cards
    config:
      meta:
        regles: [R-CAT-03]
    description: >
      Une carte d'un `new-cards` postérieur au dernier catalogue est courante, y compris
      une carte retirée puis revenue ; une carte d'un `new-cards` antérieur est rendue
      dans sa version du catalogue suivant, ou n'est plus courante si elle en est absente.
    model: stg_tcgdex__cards
    given:
      - input: source('tcgdex', 'cards')
        format: sql
        rows: |
          select * from (values
              ('ja', 'M7-001', '001', 'a', 'M7', 'M7', 'Common', 'Pokemon', null, null, null::bigint, null::timestamptz, null::timestamptz, null::varchar, null::date, '{}', 'snapshots/new-cards-2026-11-17.parquet'),
              ('en', 'tk-xy-su-26', '26', 'b', 'tk-xy-su', 'tk', 'Common', 'Pokemon', null, null, null, null, null, null, null, '{}', 'snapshots/cards-2026-11-09.parquet'),
              ('en', 'tk-xy-su-26', '26', 'b', 'tk-xy-su', 'tk', 'Common', 'Pokemon', null, null, null, null, null, null, null, '{}', 'snapshots/new-cards-2026-11-17.parquet'),
              ('fr', 'sv10-001', '001', 'c', 'sv10', 'sv10', null, 'Pokémon', null, null, null, null, null, null, null, '{}', 'snapshots/new-cards-2026-11-12.parquet'),
              ('fr', 'sv10-001', '001', 'c', 'sv10', 'sv10', 'Commune', 'Pokémon', null, null, null, null, null, null, null, '{}', 'snapshots/cards-2026-11-16.parquet'),
              ('fr', 'sv10-099', '099', 'd', 'sv10', 'sv10', null, 'Pokémon', null, null, null, null, null, null, null, '{}', 'snapshots/new-cards-2026-11-12.parquet')
          ) as t (language, card_id, local_id, name, set_id, set_name, rarity, category, illustrator, image, id_product, updated, fetched_at, fingerprint, removed_on, raw_json, filename)
    expect:
      rows:
        - {
            card_id: M7-001,
            language_code: ja,
            rarity: Common,
            last_seen_on: 2026-11-17,
            is_current: true,
          }
        - {
            card_id: tk-xy-su-26,
            language_code: en,
            rarity: Common,
            last_seen_on: 2026-11-17,
            is_current: true,
          }
        - {
            card_id: sv10-001,
            language_code: fr,
            rarity: Commune,
            last_seen_on: 2026-11-16,
            is_current: true,
          }
        - {
            card_id: sv10-099,
            language_code: fr,
            rarity: null,
            last_seen_on: 2026-11-12,
            is_current: false,
          }

  - name: stg_tcgdex__cards_reads_removed_on
    config:
      meta:
        regles: [R-CAT-03, R-CAT-04]
    description: >
      Une carte marquée `removed_on` dans le dernier catalogue n'est plus courante et
      garde la date du dernier fichier où elle était présente ; une carte revenue
      (`removed_on` effacé) est courante.
    model: stg_tcgdex__cards
    given:
      - input: source('tcgdex', 'cards')
        format: sql
        rows: |
          select * from (values
              ('fr', 'hgss3-1', '1', 'a', 'hgss3', 'Indomptable', 'Rare', 'Pokémon', null, null, null::bigint, null::timestamptz, null::timestamptz, null::varchar, null::date, '{}', 'snapshots/cards-2026-11-16.parquet'),
              ('fr', 'hgss3-1', '1', 'a', 'hgss3', 'Indomptable', 'Rare', 'Pokémon', null, null, null, null, null, 'f1', '2026-11-18', '{}', 'snapshots/cards-2026-11-18.parquet'),
              ('en', 'tk-xy-su-26', '26', 'b', 'tk-xy-su', 'tk', 'Common', 'Trainer', null, null, null, null, null, 'f2', '2026-11-17', '{}', 'snapshots/cards-2026-11-17.parquet'),
              ('en', 'tk-xy-su-26', '26', 'b', 'tk-xy-su', 'tk', 'Common', 'Trainer', null, null, null, null, null, 'f2', null, '{}', 'snapshots/cards-2026-11-18.parquet'),
              ('ja', 'SV2P-001', '001', 'c', 'SV2P', 'SV2P', null, 'Pokemon', null, null, null, null, null, 'f3', null, '{}', 'snapshots/cards-2026-11-18.parquet')
          ) as t (language, card_id, local_id, name, set_id, set_name, rarity, category, illustrator, image, id_product, updated, fetched_at, fingerprint, removed_on, raw_json, filename)
    expect:
      rows:
        - {
            card_id: hgss3-1,
            language_code: fr,
            last_seen_on: 2026-11-16,
            removed_on: 2026-11-18,
            is_current: false,
          }
        - {
            card_id: tk-xy-su-26,
            language_code: en,
            last_seen_on: 2026-11-18,
            removed_on: null,
            is_current: true,
          }
        - {
            card_id: SV2P-001,
            language_code: ja,
            last_seen_on: 2026-11-18,
            removed_on: null,
            is_current: true,
          }
