version: 2

sources:
  - name: tcgdex
    description: >
      Snapshots de TCGdex, dans le dossier de la variable `snapshot_dir`, un fichier
      `<préfixe>AAAA-MM-JJ.parquet` par jour : catalogue (`cards-`, chaque jour depuis COL-05,
      le lundi avant), nouvelles cartes (`new-cards-`, s'il y en a), sets (`sets-`, chaque jour),
      publics ; prix (`prices-`, chaque jour), privés. `card-changes-` n'est pas encore lu
      (lot à définir quand un modèle en aura besoin).
    tables:
      - name: cards
        description: >
          Une ligne par carte, langue et fichier, catalogue complet (`cards-*`) ou nouvelles
          cartes (`new-cards-*`) ; type et date du fichier tirés de son nom (`filename`).
          Un seul motif pour les deux : un motif sans fichier fait échouer `read_parquet`.
          Colonnes lues par nom : les fichiers antérieurs à COL-05 n'ont ni `fingerprint` ni
          `removed_on`, lus vides.
        meta:
          external_location: "read_parquet('{{ var('snapshot_dir') }}/*cards-*.parquet', filename = true, union_by_name = true)"
        columns:
          - name: language
            data_type: varchar
            description: Langue de la fiche (`fr`, `en`, `ja`).
          - name: card_id
            data_type: varchar
            description: Identifiant TCGdex de la carte, commun aux langues.
          - name: local_id
            data_type: varchar
            description: Numéro dans le set, pas toujours numérique (`33b`, `GRA`).
          - name: name
            data_type: varchar
            description: Nom dans la langue de la fiche.
          - name: set_id
            data_type: varchar
            description: Identifiant TCGdex du set.
          - name: set_name
            data_type: varchar
            description: Nom du set dans la langue de la fiche.
          - name: rarity
            data_type: varchar
            description: Rareté brute, propre à chaque langue, parfois vide.
          - name: category
            data_type: varchar
            description: Catégorie dans la langue de la fiche (`Pokémon`, `Trainer`, `Énergie`…).
          - name: illustrator
            data_type: varchar
            description: Illustrateur.
          - name: image
            data_type: varchar
            description: URL de base de l'image.
          - name: id_product
            data_type: bigint
            description: Produit Cardmarket, clé des prix ; parfois absent.
          - name: updated
            data_type: timestamp with time zone
            description: Dernière mise à jour de la fiche chez TCGdex.
          - name: fetched_at
            data_type: timestamp with time zone
            description: Heure de la dernière lecture de la fiche.
          - name: fingerprint
            data_type: varchar
            description: SHA-256 de la fiche hors prix et `updated`, vide avant COL-05.
          - name: removed_on
            data_type: date
            description: >
              Jour où la carte a disparu de la liste de l'API, vide si elle y figure ; la
              ligne reste dans les `cards-*` suivants.
          - name: raw_json
            data_type: varchar
            description: Fiche de l'API, sans les prix.
          - name: filename
            data_type: varchar
            description: Chemin du fichier lu, ajouté par `read_parquet`.
      - name: sets
        description: Une ligne par set, langue et snapshot (`sets-AAAA-MM-JJ.parquet`), avec date de sortie et série.
        meta:
          external_location: "read_parquet('{{ var('snapshot_dir') }}/sets-*.parquet', filename = true)"
        columns:
          - name: language
            data_type: varchar
            description: Langue de la fiche (`fr`, `en`, `ja`).
          - name: set_id
            data_type: varchar
            description: Identifiant TCGdex du set, commun aux langues.
          - name: name
            data_type: varchar
            description: Nom du set dans la langue de la fiche.
          - name: serie_id
            data_type: varchar
            description: Identifiant TCGdex de la série.
          - name: serie_name
            data_type: varchar
            description: Nom de la série dans la langue de la fiche.
          - name: release_date
            data_type: date
            description: Date de sortie dans la langue de la fiche.
          - name: abbreviation_official
            data_type: varchar
            description: Sigle officiel (`DAA`), absent pour certains sets.
          - name: abbreviation_localized
            data_type: varchar
            description: Sigle dans la langue de la fiche (`TEM`), absent pour certains sets.
          - name: card_count_total
            data_type: bigint
            description: Nombre total de cartes, cartes secrètes comprises.
          - name: card_count_official
            data_type: bigint
            description: Nombre de cartes annoncé.
          - name: logo
            data_type: varchar
            description: URL de base du logo.
          - name: symbol
            data_type: varchar
            description: URL de base du symbole.
          - name: fetched_at
            data_type: timestamp with time zone
            description: Heure de la collecte.
          - name: raw_json
            data_type: varchar
            description: Fiche du set renvoyée par l'API, sans la liste `cards`.
          - name: filename
            data_type: varchar
            description: Chemin du fichier lu, ajouté par `read_parquet`.
      - name: prices
        description: >
          Une ligne par produit Cardmarket et par fichier (`prices-AAAA-MM-JJ.parquet`), au schéma
          `snapshot.PRICE_SCHEMA` : prix Cardmarket en colonnes, TCGplayer en JSON. Privés : jamais
          versionnés, sauf l'échantillon fictif de `dbt/sample/snapshots/`.
        meta:
          external_location: "read_parquet('{{ var('snapshot_dir') }}/prices-*.parquet', filename = true, union_by_name = true)"
        columns:
          - name: language
            data_type: varchar
            description: Langue de la carte interrogée pour ce produit (`fr`, puis `en`, puis `ja`).
          - name: card_id
            data_type: varchar
            description: Carte interrogée pour ce produit ; plusieurs cartes partagent un produit.
          - name: id_product
            data_type: bigint
            description: Produit Cardmarket, une ligne par produit et par fichier.
          - name: fetched_at
            data_type: timestamp with time zone
            description: Heure de la requête du produit ; la collecte dure plus d'une heure.
          - name: cm_updated
            data_type: timestamp with time zone
            description: Mise à jour du guide de prix Cardmarket.
          - name: cm_unit
            data_type: varchar
            description: Devise Cardmarket (`EUR`).
          - name: cm_avg
            data_type: double
            description: Prix moyen de vente, en `EUR` ; `0` veut dire absent.
          - name: cm_low
            data_type: double
            description: Prix le plus bas proposé, en `EUR` ; `0` veut dire absent.
          - name: cm_trend
            data_type: double
            description: Prix de tendance de Cardmarket, en `EUR` ; `0` veut dire absent.
          - name: cm_avg1
            data_type: double
            description: Moyenne des ventes sur 1 jour, en `EUR` ; `0` veut dire absent.
          - name: cm_avg7
            data_type: double
            description: Moyenne des ventes sur 7 jours, en `EUR` ; `0` veut dire absent.
          - name: cm_avg30
            data_type: double
            description: Moyenne des ventes sur 30 jours, en `EUR` ; `0` veut dire absent.
          - name: cm_avg_holo
            data_type: double
            description: Prix moyen de vente du reverse (`reverseHolo*` de Cardmarket), en `EUR` ; `0` ou vide veut dire absent.
          - name: cm_low_holo
            data_type: double
            description: Prix le plus bas proposé du reverse (`reverseHolo*` de Cardmarket), en `EUR` ; `0` ou vide veut dire absent.
          - name: cm_trend_holo
            data_type: double
            description: Prix de tendance du reverse (`reverseHolo*` de Cardmarket), en `EUR` ; `0` ou vide veut dire absent.
          - name: cm_avg1_holo
            data_type: double
            description: Moyenne des ventes sur 1 jour du reverse (`reverseHolo*` de Cardmarket), en `EUR` ; `0` ou vide veut dire absent.
          - name: cm_avg7_holo
            data_type: double
            description: Moyenne des ventes sur 7 jours du reverse (`reverseHolo*` de Cardmarket), en `EUR` ; `0` ou vide veut dire absent.
          - name: cm_avg30_holo
            data_type: double
            description: Moyenne des ventes sur 30 jours du reverse (`reverseHolo*` de Cardmarket), en `EUR` ; `0` ou vide veut dire absent.
          - name: tcgplayer_json
            data_type: varchar
            description: >
              Prix TCGplayer en JSON, vide pour environ 40 % des produits : `unit` (`USD`),
              `updated` (ISO 8601) et une clé par finition (`normal`, `holofoil`,
              `reverse-holofoil`…) avec `lowPrice`, `midPrice`, `highPrice`, `marketPrice`,
              `directLowPrice` et `productId`.
          - name: filename
            data_type: varchar
            description: Chemin du fichier lu, ajouté par `read_parquet` ; date du prix tirée de son nom.
