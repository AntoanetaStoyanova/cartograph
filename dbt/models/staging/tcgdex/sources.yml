version: 2

sources:
  - name: tcgdex
    description: Snapshots hebdomadaires du catalogue TCGdex (`cards-AAAA-MM-JJ.parquet`), dans le dossier de la variable `snapshot_dir`.
    tables:
      - name: cards
        description: Une ligne par carte, langue et snapshot ; la date du snapshot est dans le nom du fichier (`filename`).
        meta:
          external_location: "read_parquet('{{ var('snapshot_dir') }}/cards-*.parquet', filename = true)"
        columns:
          - name: language
            description: Langue de la fiche (`fr`, `en`, `ja`).
          - name: card_id
            description: Identifiant TCGdex de la carte, commun aux langues.
          - name: local_id
            description: Numéro dans le set, pas toujours numérique (`33b`, `GRA`).
          - name: name
            description: Nom dans la langue de la fiche.
          - name: set_id
            description: Identifiant TCGdex du set.
          - name: set_name
            description: Nom du set dans la langue de la fiche.
          - name: rarity
            description: Rareté brute, propre à chaque langue, parfois vide.
          - name: category
            description: Catégorie dans la langue de la fiche (`Pokémon`, `Trainer`, `Énergie`…).
          - name: illustrator
            description: Illustrateur.
          - name: image
            description: URL de base de l'image.
          - name: id_product
            description: Produit Cardmarket, clé des prix ; parfois absent.
          - name: updated
            description: Dernière mise à jour de la fiche chez TCGdex.
          - name: fetched_at
            description: Heure de la collecte.
          - name: raw_json
            description: Fiche complète renvoyée par l'API.
          - name: filename
            description: Chemin du fichier lu, ajouté par `read_parquet`.
