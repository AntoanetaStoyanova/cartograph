version: 2

macros:
  - name: snapshot_date
    description: >
      Date d'un snapshot tirée de la fin du nom de son fichier (`-AAAA-MM-JJ.parquet`),
      commune à `cards-`, `new-cards-` et `sets-` ; la date de référence de STO-01.
    arguments:
      - name: filename
        type: string
        description: Colonne ou expression SQL qui contient le chemin du fichier (`filename` de `read_parquet`).
