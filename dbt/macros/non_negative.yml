version: 2

macros:
  - name: test_non_negative
    description: >
      Test générique : renvoie les lignes où la colonne est négative ; une valeur vide
      n'échoue pas (un prix absent est permis, un prix négatif est une erreur de la source).
    arguments:
      - name: model
        type: string
        description: Modèle testé.
      - name: column_name
        type: string
        description: Colonne numérique testée.
